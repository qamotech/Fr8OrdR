<style>
:root{--bg-dark:#0f172a;--bg-panel:rgba(30,41,59,.75);--bg-card:rgba(30,41,59,.85);--bg-body:#0f172a;--text-main:#f8fafc;--text-muted:#94a3b8;--primary:#6366f1;--primary-hover:#4f46e5;--secondary:#ec4899;--accent:#14b8a6;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--border:rgba(255,255,255,.12);--glass-shadow:0 12px 40px 0 rgba(0,0,0,.45);--glass-blur:blur(16px);--sidebar-bg:rgba(15,23,42,.9);--header-bg:rgba(15,23,42,.7);--input-bg:rgba(255,255,255,.06);--input-placeholder:#64748b;--glow-primary:rgba(99,102,241,.4);--glow-success:rgba(16,185,129,.4);--glow-danger:rgba(239,68,68,.4)}
:root[data-theme="light"]{--bg-dark:#f8fafc;--bg-panel:rgba(255,255,255,.95);--bg-card:rgba(255,255,255,1);--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:rgba(15,23,42,.15);--glass-shadow:0 8px 32px 0 rgba(15,23,42,.08);--sidebar-bg:rgba(255,255,255,1);--header-bg:rgba(255,255,255,.92);--input-bg:#f1f5f9;--input-placeholder:#94a3b8;--glow-primary:rgba(99,102,241,.25);--glow-success:rgba(16,185,129,.25);--glow-danger:rgba(239,68,68,.25)}

*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.45)}
body{font-family:'Outfit',sans-serif;background-color:var(--bg-body);color:var(--text-main);min-height:100vh;transition:background-color .35s ease,color .35s ease;background-image:radial-gradient(circle at 10% 20%,rgba(99,102,241,.12) 0%,transparent 45%),radial-gradient(circle at 90% 80%,rgba(236,72,153,.1) 0%,transparent 45%);background-attachment:fixed;overflow-x:hidden}

.glass-panel{background:var(--bg-panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--border);border-radius:16px;box-shadow:var(--glass-shadow);transition:border-color .3s ease,transform .3s ease}
.glass-card{background:var(--bg-card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--border);border-radius:14px;transition:transform .3s cubic-bezier(.4,0,.2,1),box-shadow .3s ease,border-color .3s ease}
.glass-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px 0 rgba(0,0,0,.35),0 0 0 1px rgba(99,102,241,.2);border-color:rgba(99,102,241,.3)}

.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-hover) 100%);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 15px var(--glow-primary);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;user-select:none}
.btn-primary:hover{box-shadow:0 8px 25px var(--glow-primary);transform:translateY(-2px)}.btn-primary:active{transform:scale(.96) translateY(0)}
.btn-secondary{background:var(--input-bg);color:var(--text-main);border:1px solid var(--border);padding:10px 20px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.btn-secondary:hover{background:rgba(148,163,184,.18);border-color:rgba(99,102,241,.3);transform:translateY(-1px)}.btn-secondary:active{transform:scale(.96)}
.btn-danger{background:linear-gradient(135deg,var(--danger) 0%,#dc2626 100%);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease;box-shadow:0 4px 15px var(--glow-danger);display:inline-flex;align-items:center;justify-content:center;gap:8px}

.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;padding:24px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--border);background:var(--sidebar-bg);backdrop-filter:var(--glass-blur);transition:width .35s cubic-bezier(.4,0,.2,1),background .4s ease;z-index:100;overflow-y:auto;overflow-x:hidden}
.sidebar.collapsed{width:80px}.sidebar.collapsed .brand span,.sidebar.collapsed .nav-item span,.sidebar.collapsed .sidebar-footer,.sidebar.collapsed .nav-badge{display:none}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;user-select:none;transition:gap .3s}
.brand-icon{position:relative;display:flex;align-items:center}
.nav-links{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;color:var(--text-muted);text-decoration:none;font-weight:500;font-size:14px;transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap;border-left:3px solid transparent;position:relative;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--input-bg);color:var(--text-main);transform:translateX(3px)}
.nav-item.active{background:rgba(99,102,241,.14);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--primary);border-radius:0 2px 2px 0;box-shadow:0 0 10px var(--glow-primary)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff!important;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.sidebar-footer{padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);text-align:center}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:var(--header-bg);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-shrink:0;transition:background .4s ease}
.header-title h1{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.header-title p{color:var(--text-muted);font-size:13px;margin-top:2px}
.user-profile{display:flex;align-items:center;gap:10px;background:var(--input-bg);padding:5px 14px 5px 5px;border-radius:30px;border:1px solid var(--border);cursor:pointer;transition:all .25s ease}
.user-profile:hover{border-color:rgba(99,102,241,.4);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.scroll-area{flex:1;padding:28px 32px;padding-bottom:120px;overflow-y:auto}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-bottom:28px}
.stat-card{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.stat-header{display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.stat-icon{padding:10px;border-radius:10px;background:rgba(99,102,241,.1);color:var(--primary);display:flex;align-items:center;justify-content:center}
.stat-value{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-sparkline{margin-top:4px;height:38px;width:100%}

.dashboard-grid{display:grid;grid-template-columns:5fr 3fr;gap:24px}
.section-title{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.activity-list{display:flex;flex-direction:column;gap:10px}
.activity-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;background:var(--input-bg);border:1px solid transparent;transition:all .25s cubic-bezier(.4,0,.2,1);cursor:default}
.activity-item:hover{border-color:var(--border);background:rgba(99,102,241,.05);transform:translateX(4px)}
.activity-icon{width:38px;height:38px;border-radius:10px;background:rgba(99,102,241,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.activity-content{flex:1;min-width:0}.activity-content h4{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity-content p{font-size:12px;color:var(--text-muted)}

.upload-area{border:2px dashed var(--border);border-radius:16px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--input-bg);transition:all .3s ease;cursor:pointer}
.upload-area:hover,.upload-area.active{border-color:var(--primary);background:rgba(99,102,241,.08);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.upload-icon{color:var(--primary);background:rgba(99,102,241,.12);padding:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.data-table{width:100%;border-collapse:collapse}.data-table th{text-align:left;padding:12px 16px;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
.data-table td{padding:12px 16px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .2s}.data-table tr:hover td{background:var(--input-bg)}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;letter-spacing:.3px}
.badge-success{background:rgba(16,185,129,.14);color:var(--success)}.badge-warning{background:rgba(245,158,11,.14);color:var(--warning)}.badge-info{background:rgba(99,102,241,.14);color:var(--primary)}.badge-danger{background:rgba(239,68,68,.14);color:var(--danger)}

.search-bar{display:flex;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:7px 14px;width:240px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.search-bar:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15);width:300px}
.search-bar input{background:transparent;border:none;color:var(--text-main);outline:none;margin-left:8px;width:100%;font-family:inherit;font-size:13px}.search-bar input::placeholder{color:var(--input-placeholder)}

.tab-bar{display:flex;gap:4px;margin-bottom:24px;background:var(--input-bg);padding:4px;border-radius:12px}
.tab-item{padding:8px 18px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s ease}
.tab-item:hover{color:var(--text-main)}.tab-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 10px var(--glow-primary)}

.progress-bar{height:6px;background:var(--input-bg);border-radius:3px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}

.toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.45);backdrop-filter:var(--glass-blur);pointer-events:auto;animation:toastIn .4s cubic-bezier(.4,0,.2,1) forwards;font-size:14px;min-width:280px}
.toast.exiting{animation:toastOut .3s ease forwards}.toast-icon{flex-shrink:0}

.notif-panel{position:absolute;top:calc(100% + 10px);right:0;width:340px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.5);backdrop-filter:var(--glass-blur);z-index:200;animation:dropIn .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
.notif-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.notif-item{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;cursor:pointer}.notif-item:hover{background:var(--input-bg)}.notif-item:last-child{border-bottom:none}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px}

/* Modal System */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s ease}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(.34,1.56,.64,1);position:relative}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;background:var(--input-bg)}

/* Command Palette */
.cmd-palette{max-width:640px;padding:0;overflow:hidden;border-radius:18px}
.cmd-input-wrap{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px}
.cmd-input-wrap input{background:transparent;border:none;outline:none;color:var(--text-main);font-size:16px;width:100%;font-family:inherit}
.cmd-list{max-height:360px;overflow-y:auto;padding:8px 0}
.cmd-item{padding:12px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .15s}
.cmd-item:hover,.cmd-item.selected{background:rgba(99,102,241,.15);color:var(--primary)}
.cmd-item-icon{color:var(--text-muted);display:flex;align-items:center}
.cmd-item.selected .cmd-item-icon{color:var(--primary)}

/* Equalizer Animation */
.eq-bar{width:3px;background:var(--primary);border-radius:2px;animation:eqAnim 1.2s ease-in-out infinite alternate}
@keyframes eqAnim{0%{height:4px}100%{height:18px}}

.hero-banner-content{padding:32px;position:relative;z-index:2}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0) scale(1)}to{opacity:0;transform:translateX(40px) scale(.95)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
@keyframes meshGlow{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}
@keyframes truckDrive{0%,100%{transform:translateX(0)}25%{transform:translateX(3px) translateY(-1px)}75%{transform:translateX(-2px) translateY(1px)}}

.animate-fade-in{animation:fadeIn .4s cubic-bezier(.4,0,.2,1) forwards}
.animate-slide-up{animation:slideUp .45s cubic-bezier(.4,0,.2,1) forwards}
.pulse-glow{animation:livePulse 2s ease-in-out infinite}
.live-pulse{animation:livePulse 2s ease-in-out infinite}
.truck-drive{animation:truckDrive 3s ease-in-out infinite}
.stagger-children>*{opacity:0;animation:fadeIn .4s cubic-bezier(.4,0,.2,1) forwards}
.stagger-children>*:nth-child(1){animation-delay:.04s}.stagger-children>*:nth-child(2){animation-delay:.08s}.stagger-children>*:nth-child(3){animation-delay:.12s}.stagger-children>*:nth-child(4){animation-delay:.16s}.stagger-children>*:nth-child(5){animation-delay:.2s}

.stat-trend{font-size:12px;display:flex;align-items:center;gap:4px;font-weight:600}.stat-trend.positive{color:var(--success)}.stat-trend.negative{color:var(--danger)}
.profile-grid{display:grid;grid-template-columns:minmax(250px,1fr) 2fr;gap:24px}
@media(max-width:768px){.profile-grid{grid-template-columns:1fr}}

.music-widget-panel{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;align-items:flex-end;gap:12px}

.tour-overlay{position:fixed;inset:0;z-index:10000;pointer-events:auto;transition:opacity .35s ease}
.tour-overlay.hidden{opacity:0;pointer-events:none}
.tour-backdrop{position:fixed;inset:0;z-index:10001}
.tour-spotlight{position:fixed;z-index:10002;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.75),0 0 0 4px var(--primary),0 0 30px 8px var(--glow-primary);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
.tour-caption{position:fixed;z-index:10003;width:380px;max-width:calc(100vw - 32px);animation:tourCardIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes tourCardIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.tour-caption-inner{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(99,102,241,.2);backdrop-filter:var(--glass-blur);padding:24px;position:relative}
.tour-caption-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));border-radius:16px 16px 0 0}
.tour-caption-arrow{position:absolute;width:14px;height:14px;background:var(--bg-card);border:1px solid var(--border);transform:rotate(45deg);z-index:-1}
.tour-step-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:12px;letter-spacing:.5px}
.tour-caption h3{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--text-main)}
.tour-caption p{font-size:13.5px;line-height:1.65;color:var(--text-muted);margin-bottom:18px}
.tour-controls{display:flex;align-items:center;gap:10px}
.tour-progress-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.tour-progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.tour-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.tour-progress-label{font-size:11px;font-weight:700;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tour-skip-btn{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:inherit;padding:6px 10px;border-radius:8px;transition:all .2s}.tour-skip-btn:hover{color:var(--text-main);background:var(--input-bg)}
.tour-prev-btn{background:var(--input-bg);color:var(--text-main);border:1px solid var(--border);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}.tour-prev-btn:hover{border-color:var(--primary)}
.tour-next-btn{background:linear-gradient(135deg,var(--primary),var(--primary-hover));color:white;border:none;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 15px var(--glow-primary);transition:all .25s cubic-bezier(.4,0,.2,1)}.tour-next-btn:hover{box-shadow:0 8px 25px var(--glow-primary);transform:translateY(-1px)}
.demo-btn{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border:none;padding:7px 16px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 15px rgba(245,158,11,.35);transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.3px}.demo-btn:hover{box-shadow:0 8px 25px rgba(245,158,11,.5);transform:translateY(-2px)}.demo-btn:active{transform:scale(.96)}

/* 84 Improvements: Micro-animations, responsive grid, tooltips, skeleton loaders, glassmorphism enhancements */
.hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
.hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
.skeleton { background: linear-gradient(90deg, var(--input-bg) 25%, var(--border) 50%, var(--input-bg) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; }
@keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.tooltip { position: relative; }
.tooltip:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-dark); padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 1000; pointer-events: none; }
.table-row-hover { transition: background 0.15s ease; cursor: pointer; }
.table-row-hover:hover { background: rgba(99,102,241,0.08) !important; }
.btn-primary:active { transform: scale(0.95); }
.btn-secondary:active { transform: scale(0.95); }
.glass-panel { backdrop-filter: blur(24px) saturate(150%); }
.nav-item::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; border-radius: 10px; transition: opacity 0.2s; pointer-events: none; }
.nav-item:active::after { opacity: 0.1; }
.feature-badge { background: linear-gradient(135deg, #10b981, #3b82f6); color: white; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.p-4 { padding: 16px; } .p-6 { padding: 24px; }
.mt-4 { margin-top: 16px; } .mb-4 { margin-bottom: 16px; }
.text-gradient { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
@media(max-width: 1024px) { .grid-4 { grid-template-columns: 1fr 1fr; } .dashboard-grid { grid-template-columns: 1fr; } }
@media(max-width: 768px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 0; padding: 0; opacity: 0; } .top-header { padding: 12px 16px; } .search-bar { display: none; } }
.slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.tab-content { display: none; animation: fadeIn 0.3s ease forwards; }
.tab-content.active { display: block; }

</style>

// ══════════════════════════════════════════════════════════════
// Sparkline Generator
// ══════════════════════════════════════════════════════════════
function renderSparkline(data, color='var(--primary)', width=180, height=36) {
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1
  const points = data.map((val, i) => {
    const x = (i / (data.length - 1)) * width
    const y = height - ((val - min) / range) * (height - 8) - 4
    return `${x.toFixed(1)},${y.toFixed(1)}`
  }).join(' ')

  const fillPoints = `${points} ${width},${height} 0,${height}`
  const id = 'spark-' + Math.random().toString(36).substr(2, 6)

  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="overflow:visible">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <polygon points="${fillPoints}" fill="url(#${id})"/>
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
}

// Application State
// ══════════════════════════════════════════════════════════════
let state = {
  theme: localStorage.getItem('fr8-theme') || (window.matchMedia?.('(prefers-color-scheme:dark)').matches ? 'dark' : 'dark'),
  sidebarCollapsed: window.innerWidth < 1024,
  currentPage: location.hash.slice(2) || '',
  notifCount: 3,
  showNotifs: false,
  showProfileMenu: false,
  activeModal: null, // null | 'map' | 'upload' | 'doc-preview' | 'export-report' | 'cmd'
  selectedDocId: null,
  cmdQuery: '',
}

// ══════════════════════════════════════════════════════════════
// Toast System
// ══════════════════════════════════════════════════════════════
let toastId = 0
function addToast(message, type='info', duration=3500) {
  const id = ++toastId
  const container = document.getElementById('toast-container')
  const icons = { success: I.checkCircle(20), info: I.info(20), warning: I.alertTriangle(20) }
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.id = `toast-${id}`
  el.innerHTML = `<div class="toast-icon">${icons[type]||icons.info}</div><span style="flex:1">${message}</span><span style="cursor:pointer;opacity:.5" onclick="this.closest('.toast').remove()">${I.x(16)}</span>`
  container.appendChild(el)
  setTimeout(() => { el.classList.add('exiting'); setTimeout(() => el.remove(), 300) }, duration)
}

// ══════════════════════════════════════════════════════════════
// Theme Management
// ══════════════════════════════════════════════════════════════
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme)
  localStorage.setItem('fr8-theme', state.theme)
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark'
  localStorage.setItem('fr8-theme-override', 'true')
  applyTheme()
  render()
}
applyTheme()

// ══════════════════════════════════════════════════════════════
// Router & Shortcuts
// ══════════════════════════════════════════════════════════════
function navigate(path) {
  location.hash = '#/' + path
}
window.addEventListener('hashchange', () => {
  state.currentPage = location.hash.slice(2) || ''
  state.showNotifs = false
  state.showProfileMenu = false
  state.activeModal = null
  render()
})

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault()
    openModal('cmd')
  } else if (e.key === 'Escape') {
    if (state.activeModal) closeModal()
    if (state.showProfileMenu) { state.showProfileMenu = false; render() }
    if (state.showNotifs) { state.showNotifs = false; render() }
  }
})

// ══════════════════════════════════════════════════════════════
// Clock & Greetings
// ══════════════════════════════════════════════════════════════
let clockStr = ''
function tickClock() {
  clockStr = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
  const el = document.getElementById('header-clock')
  if (el) el.textContent = clockStr
}
tickClock(); setInterval(tickClock, 30000)

function getGreeting() {
  const h = new Date().getHours()
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'
}

// ══════════════════════════════════════════════════════════════
// Modal Controller
// ══════════════════════════════════════════════════════════════
function openModal(modalType, docId=null) {
  state.activeModal = modalType
  state.selectedDocId = docId
  renderModal()
}
function closeModal() {
  state.activeModal = null
  state.selectedDocId = null
  renderModal()
}

function renderModal() {
  const container = document.getElementById('modal-container')
  if (!state.activeModal) { container.innerHTML = ''; return }

  let content = ''
  if (state.activeModal === 'map') content = renderMapModal()
  else if (state.activeModal === 'upload') content = renderUploadModal()
  else if (state.activeModal === 'doc-preview') content = renderDocPreviewModal()
  else if (state.activeModal === 'export-report') content = renderExportReportModal()
  else if (state.activeModal === 'cmd') content = renderCommandPaletteModal()

  container.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${content}</div>`
  if (state.activeModal === 'cmd') {
    setTimeout(() => document.getElementById('cmd-input')?.focus(), 50)
  }
}

function simulateDocUpload(input) {
  if (!input.files || !input.files[0]) return
  const box = document.getElementById('upload-progress-box')
  const name = document.getElementById('upload-file-name')
  const pct = document.getElementById('upload-status-pct')
  const fill = document.getElementById('upload-bar-fill')
  box.style.display = 'block'
  name.textContent = input.files[0].name
  let progress = 0
  const timer = setInterval(() => {
    progress += 25
    pct.textContent = progress + '%'
    fill.style.width = progress + '%'
    if (progress >= 100) {
      clearInterval(timer)
      addToast('OCR scan completed! Extracted Load #LD-8490 data.','success')
    }
  }, 200)
}

function sendChatMessage() {
  const input = document.getElementById('msg-input')
  if (!input || !input.value.trim()) return
  const area = document.getElementById('msg-area')
  const time = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
  area.insertAdjacentHTML('beforeend', `<div class="animate-slide-up" style="align-self:flex-end;background:var(--primary);color:#fff;padding:10px 16px;border-radius:16px 16px 4px 16px;max-width:70%;box-shadow:0 4px 12px var(--glow-primary)"><p style="font-size:14px;line-height:1.5">${input.value}</p><span style="font-size:10px;opacity:.7;margin-top:4px;display:block">You — ${time}</span></div>`)
  input.value = ''
  area.scrollTop = area.scrollHeight

  area.insertAdjacentHTML('beforeend', `<div id="typing-indicator" class="animate-fade-in" style="align-self:flex-start;padding:10px 16px;background:var(--bg-card);border-radius:16px 16px 16px 4px;border:1px solid var(--border)"><div style="display:flex;gap:4px"><span class="live-pulse" style="width:6px;height:6px;border-radius:50%;background:var(--text-muted)"></span><span class="live-pulse" style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation-delay:.2s"></span><span class="live-pulse" style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation-delay:.4s"></span></div></div>`)
  area.scrollTop = area.scrollHeight

  setTimeout(() => {
    const ti = document.getElementById('typing-indicator')
    if (ti) ti.remove()
    const replies = ['10-4, got it!', "Sounds good, I'll handle it.", 'Copy that. Heading out now.', 'Will do. Love you!']
    const reply = replies[Math.floor(Math.random() * replies.length)]
    const t2 = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
    area.insertAdjacentHTML('beforeend', `<div class="animate-slide-up" style="align-self:flex-start;background:var(--bg-card);color:var(--text-main);padding:10px 16px;border-radius:16px 16px 16px 4px;max-width:70%;border:1px solid var(--border)"><p style="font-size:14px;line-height:1.5">${reply}</p><span style="font-size:10px;opacity:.7;margin-top:4px;display:block">Moses — ${t2}</span></div>`)
    area.scrollTop = area.scrollHeight
  }, 1200)
}

let tour = { active: false, step: 0 }

function startTour() {
  tour.active = true
  tour.step = 0
  state.showNotifs = false
  state.showProfileMenu = false
  showTourStep()
}
function endTour() {
  tour.active = false
  const overlay = document.getElementById('tour-overlay')
  overlay.classList.add('hidden')
  setTimeout(() => { overlay.innerHTML = '' }, 350)
}
function showTourStep() {
  const step = TOUR_STEPS[tour.step]
  if (!step) { endTour(); return }
  if (state.currentPage !== step.page) {
    navigate(step.page)
    setTimeout(() => positionTourUI(step), 120)
  } else {
    positionTourUI(step)
  }
}

function positionTourUI(step) {
  const overlay = document.getElementById('tour-overlay')
  overlay.classList.remove('hidden')

  const el = document.querySelector(step.selector)
  if (!el) { overlay.innerHTML = buildCaptionFallback(step); return }

  const scrollArea = document.querySelector('.scroll-area')
  const isHeaderOrSidebar = (el === document.querySelector('#demo-tour-btn') || document.querySelector('.sidebar').contains(el))

  if (scrollArea && !isHeaderOrSidebar) {
    const elRect = el.getBoundingClientRect()
    const diff = elRect.top - 85
    scrollArea.scrollTop += diff
  } else {
    el.scrollIntoView({ behavior: 'instant', block: 'nearest' })
  }

  setTimeout(() => {
    const rect = el.getBoundingClientRect()
    const pad = 14
    const capW = Math.min(380, window.innerWidth - 32)
    const capH = 260
    const gap = 18
    const minTop = isHeaderOrSidebar ? 16 : 80
    const maxTop = window.innerHeight - capH - 16

    const capW360 = Math.min(360, window.innerWidth - 32)
    const rightLeft = Math.min(rect.right + gap, window.innerWidth - capW360 - 16)

    const candidates = [
      {
        dir: 'right',
        left: rightLeft,
        top: Math.max(minTop, Math.min(maxTop, rect.top + 20)),
        valid: (rightLeft >= rect.right - 5) && (rightLeft + capW360 <= window.innerWidth - 8),
        arrow: `top:24px;left:-8px;border-top-color:transparent;border-right-color:transparent`
      },
      {
        dir: 'bottom',
        left: Math.max(16, Math.min(window.innerWidth - capW - 16, rect.left + rect.width/2 - capW/2)),
        top: rect.bottom + gap,
        valid: (rect.bottom + gap + capH <= window.innerHeight - 16),
        arrow: `top:-8px;left:${Math.min(capW - 30, Math.max(20, rect.left + rect.width/2 - (Math.max(16, Math.min(window.innerWidth - capW - 16, rect.left + rect.width/2 - capW/2)))))}px;border-bottom-color:transparent;border-right-color:transparent`
      },
      {
        dir: 'top',
        left: Math.max(16, Math.min(window.innerWidth - capW - 16, rect.left + rect.width/2 - capW/2)),
        top: rect.top - gap - capH,
        valid: (rect.top - gap - capH >= minTop),
        arrow: `bottom:-8px;left:${Math.min(capW - 30, Math.max(20, rect.left + rect.width/2 - (Math.max(16, Math.min(window.innerWidth - capW - 16, rect.left + rect.width/2 - capW/2)))))}px;border-top-color:transparent;border-left-color:transparent`
      },
      {
        dir: 'left',
        left: rect.left - gap - capW,
        top: Math.max(minTop, Math.min(maxTop, rect.top + rect.height/2 - 100)),
        valid: (rect.left - gap - capW >= 16),
        arrow: `top:24px;right:-8px;border-top-color:transparent;border-left-color:transparent`
      }
    ]

    let best = candidates.find(c => c.dir === step.position && c.valid)
    if (!best) best = candidates.find(c => c.valid)

    if (!best) {
      if (scrollArea && !isHeaderOrSidebar && step.position === 'bottom') {
        const extraShift = (rect.bottom + gap + capH) - (window.innerHeight - 16)
        if (extraShift > 0) scrollArea.scrollTop += extraShift + 10
      }
      best = {
        top: Math.max(minTop, Math.min(maxTop, rect.bottom + gap)),
        left: Math.max(16, Math.min(window.innerWidth - capW - 16, rect.left + rect.width/2 - capW/2)),
        arrow: `display:none`
      }
    }

    const newRect = el.getBoundingClientRect()
    const spotStyle = `top:${Math.max(0, newRect.top - pad)}px;left:${Math.max(0, newRect.left - pad)}px;width:${newRect.width + pad*2}px;height:${newRect.height + pad*2}px`
    const capTop = Math.max(minTop, Math.min(window.innerHeight - capH - 16, best.top))
    const capLeft = Math.max(16, Math.min(window.innerWidth - capW - 16, best.left))

    const total = TOUR_STEPS.length
    const pct = ((tour.step + 1) / total * 100).toFixed(0)
    const isFirst = tour.step === 0
    const isLast = tour.step === total - 1

    overlay.innerHTML = `
      <div class="tour-backdrop" onclick="endTour()"></div>
      <div class="tour-spotlight" style="${spotStyle}"></div>
      <div class="tour-caption" id="active-tour-caption" style="top:${capTop}px;left:${capLeft}px;width:${capW}px">
        <div class="tour-caption-arrow" style="${best.arrow}"></div>
        <div class="tour-caption-inner">
          <div class="tour-step-badge">${I.play(10)} Step ${tour.step + 1} of ${total}</div>
          <h3>${step.title}</h3>
          <p>${step.body}</p>
          <div class="tour-controls">
            <div class="tour-progress-wrap"><div class="tour-progress-track"><div class="tour-progress-fill" style="width:${pct}%"></div></div><span class="tour-progress-label">${tour.step + 1}/${total}</span></div>
            <button class="tour-skip-btn" onclick="endTour()">Skip</button>
            ${!isFirst ? `<button class="tour-prev-btn" onclick="tourPrev()">Back</button>` : ''}
            <button class="tour-next-btn" onclick="tourNext()">${isLast ? 'Finish ✓' : 'Next →'}</button>
          </div>
        </div>
      </div>`

    requestAnimationFrame(() => {
      const capEl = document.getElementById('active-tour-caption')
      if (capEl) {
        const cRect = capEl.getBoundingClientRect()
        let finalTop = capTop, finalLeft = capLeft
        if (cRect.top < minTop) finalTop = minTop
        if (cRect.bottom > window.innerHeight - 16) finalTop = Math.max(minTop, window.innerHeight - cRect.height - 16)
        if (cRect.left < 16) finalLeft = 16
        if (cRect.right > window.innerWidth - 16) finalLeft = Math.max(16, window.innerWidth - cRect.width - 16)
        if (finalTop !== capTop || finalLeft !== capLeft) {
          capEl.style.top = finalTop + 'px'; capEl.style.left = finalLeft + 'px'
        }
      }
    })
  }, step.page !== state.currentPage ? 350 : 80)
}

function buildCaptionFallback(step) {
  const total = TOUR_STEPS.length, pct = ((tour.step + 1) / total * 100).toFixed(0)
  return `
    <div class="tour-backdrop" onclick="endTour()"></div>
    <div class="tour-caption" style="top:50%;left:50%;transform:translate(-50%,-50%);width:380px">
      <div class="tour-caption-inner">
        <div class="tour-step-badge">${I.play(10)} Step ${tour.step + 1} of ${total}</div>
        <h3>${step.title}</h3>
        <p>${step.body}</p>
        <div class="tour-controls">
          <div class="tour-progress-wrap"><div class="tour-progress-track"><div class="tour-progress-fill" style="width:${pct}%"></div></div><span class="tour-progress-label">${tour.step + 1}/${total}</span></div>
          <button class="tour-skip-btn" onclick="endTour()">Skip</button>
          ${tour.step > 0 ? `<button class="tour-prev-btn" onclick="tourPrev()">Back</button>` : ''}
          <button class="tour-next-btn" onclick="tourNext()">${tour.step === total - 1 ? 'Finish ✓' : 'Next →'}</button>
        </div>
      </div>
    </div>`
}
function tourNext() { if (tour.step < TOUR_STEPS.length - 1) { tour.step++; showTourStep() } else { endTour(); addToast('Tour complete!', 'success') } }
function tourPrev() { if (tour.step > 0) { tour.step--; showTourStep() } }
